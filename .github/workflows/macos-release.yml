name: macOS Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | head -n 1)"
          if [[ -z "$XCODE_APP" ]]; then
            echo "Xcode 26 is required for Swift tools version 6.2." >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          swift --version
          test "$(uname -m)" = "arm64"

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"

          if [[ "$TAG_NAME" != v* ]] || [[ -z "$VERSION" ]]; then
            echo "Invalid release tag: $TAG_NAME" >&2
            exit 1
          fi

          DMG_NAME="FindTree-${VERSION}-arm64.dmg"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${DMG_NAME}"

          {
            echo "tag_name=$TAG_NAME"
            echo "version=$VERSION"
            echo "dmg_name=$DMG_NAME"
            echo "download_url=$DOWNLOAD_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Validate scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-release.sh scripts/generate-cask.sh
          zsh -n scripts/build-app.sh

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          swift test

      - name: Build release DMG
        shell: bash
        run: ./scripts/build-release.sh "${{ steps.release.outputs.version }}"

      - name: Verify release artifact and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test -f "${{ steps.release.outputs.dmg_name }}"
          test -f "${{ steps.release.outputs.dmg_name }}.sha256"
          shasum -a 256 -c "${{ steps.release.outputs.dmg_name }}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          name: ${{ steps.release.outputs.tag_name }}
          generate_release_notes: true
          files: |
            dist/${{ steps.release.outputs.dmg_name }}
            dist/${{ steps.release.outputs.dmg_name }}.sha256

      - name: Checkout default branch for Cask update
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tap-repository

      - name: Update Homebrew Cask in this repository
        shell: bash
        run: |
          set -euo pipefail

          SHA256="$(awk '{print $1}' "dist/${{ steps.release.outputs.dmg_name }}.sha256")"

          ./scripts/generate-cask.sh \
            "${{ steps.release.outputs.version }}" \
            "$SHA256" \
            "${{ steps.release.outputs.download_url }}" \
            "tap-repository/Casks/findtree.rb" \
            "https://github.com/${GITHUB_REPOSITORY}"

          ruby -c tap-repository/Casks/findtree.rb

      - name: Commit and push Homebrew Cask
        shell: bash
        working-directory: tap-repository
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/findtree.rb

          if git diff --cached --quiet; then
            echo "Homebrew Cask is already up to date."
            exit 0
          fi

          git commit -m "FindTree ${{ steps.release.outputs.tag_name }} のCaskを更新"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
